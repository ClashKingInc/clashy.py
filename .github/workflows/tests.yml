name: clashy.py local service verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python -m compileall -q coc scripts/verify_contract_http.py
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/checkout@v4
        with:
          repository: ClashKingInc/ClashTestingAPI
          ref: 3e1a1cf52906dcd5a5f57834baec5d5e85c98428
          path: .ci-mock
          persist-credentials: false
      - run: npm ci --ignore-scripts --prefix .ci-mock
      - run: npm run build --prefix .ci-mock
      - name: Verify actual SDK through the local Mock API Worker
        working-directory: .ci-mock
        env:
          CLASH_CONTRACT_PYTHON: ${{ github.workspace }}/.venv/bin/python
          CLASH_CONTRACT_PYTHON_REPO: ${{ github.workspace }}
        run: node --import tsx scripts/verify-native-consumers.ts
